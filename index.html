<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘의 직업 뽑기</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Noto Sans KR", "Malgun Gothic", sans-serif;
    background: linear-gradient(135deg, #eef4ff, #fff7ef);
    color: #24324a;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px;
  }
  .app {
    width: min(720px, 100%);
    background: rgba(255,255,255,.94);
    border-radius: 30px;
    padding: 34px 28px 28px;
    box-shadow: 0 18px 55px rgba(40,55,90,.16);
    text-align: center;
  }
  .badge {
    display: inline-block;
    padding: 7px 14px;
    border-radius: 999px;
    background: #edf2ff;
    color: #5369c8;
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 10px;
  }
  h1 {
    margin: 0;
    font-size: clamp(32px, 7vw, 54px);
    letter-spacing: -2px;
  }
  .subtitle {
    margin: 10px 0 26px;
    color: #69758b;
    font-size: 17px;
  }
  .card {
    min-height: 390px;
    border-radius: 26px;
    padding: 30px 24px;
    background: #f8faff;
    border: 2px solid #e6ebfa;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }
  .icon {
    font-size: 86px;
    line-height: 1;
    margin-bottom: 18px;
  }
  .job-name {
    font-size: clamp(32px, 7vw, 50px);
    font-weight: 900;
    letter-spacing: -2px;
    margin: 0 0 12px;
  }
  .description {
    max-width: 560px;
    line-height: 1.65;
    font-size: 17px;
    color: #59657a;
    margin: 0;
  }
  .mission {
    width: 100%;
    max-width: 560px;
    margin-top: 22px;
    padding: 17px 18px;
    border-radius: 18px;
    background: white;
    border: 1px solid #e5e9f2;
    text-align: left;
  }
  .mission-title {
    font-weight: 900;
    margin-bottom: 7px;
  }
  .mission-text { line-height: 1.55; }
  button {
    border: 0;
    cursor: pointer;
    font: inherit;
  }
  .draw {
    margin-top: 22px;
    width: 100%;
    max-width: 420px;
    padding: 17px 24px;
    border-radius: 17px;
    background: #5066d9;
    color: white;
    font-size: 20px;
    font-weight: 900;
    box-shadow: 0 9px 20px rgba(80,102,217,.25);
    transition: transform .15s, opacity .15s;
  }
  .draw:hover { transform: translateY(-2px); }
  .draw:active { transform: translateY(1px); }
  .hint {
    margin-top: 13px;
    color: #8a94a6;
    font-size: 13px;
  }
  .rolling .icon,
  .rolling .job-name,
  .rolling .description,
  .rolling .mission { opacity: .45; }
  @media (max-width: 520px) {
    body { padding: 12px; }
    .app { padding: 25px 16px 20px; border-radius: 22px; }
    .card { min-height: 370px; padding: 25px 17px; }
  }
</style>
</head>
<body>
<main class="app">
  <div class="badge">🎯 초등 수업용</div>
  <h1>오늘의 직업 뽑기</h1>
  <p class="subtitle">어떤 직업이 나올까요? 버튼을 눌러 보세요!</p>

  <section class="card" id="card">
    <div class="icon" id="icon">🎲</div>
    <h2 class="job-name" id="jobName">오늘의 직업은?</h2>
    <p class="description" id="description">두근두근! 버튼을 누르면 새로운 직업이 나타납니다.</p>
    <div class="mission" id="mission" style="display:none;">
      <div class="mission-title">💡 오늘의 미션</div>
      <div class="mission-text" id="missionText"></div>
    </div>
  </section>

  <button class="draw" id="drawButton">🎲 직업 뽑기</button>
  <div class="hint">친구와 결과를 공유하고 직업의 특징을 이야기해 보세요.</div>
</main>

<script>
/*
  ============================
  ✏️ 직업 목록 수정하는 곳
  ============================
  name       : 직업 이름
  icon       : 직업 아이콘(이모지)
  description: 직업 설명
  mission    : 수업용 미션
*/
const jobs = [
  { name:"건축가", icon:"🏛️", description:"사람들이 생활하고 활동할 건물과 공간을 설계합니다.", mission:"내가 살고 싶은 미래의 집이나 학교를 그림으로 표현해 보세요." },
  { name:"요리사", icon:"👨‍🍳", description:"재료를 활용해 맛있는 음식을 만들고 새로운 메뉴를 개발합니다.", mission:"나만의 특별한 메뉴 이름과 음식 모양을 디자인해 보세요." },
  { name:"소방관", icon:"🚒", description:"화재를 진압하고 사고 현장에서 사람을 구조하며 안전을 지킵니다.", mission:"용기와 안전을 상징하는 로고를 만들어 보세요." },
  { name:"수의사", icon:"🐾", description:"아픈 동물을 진료하고 건강하게 생활할 수 있도록 돕습니다.", mission:"동물을 위한 병원 로고를 디자인해 보세요." },
  { name:"게임 개발자", icon:"🎮", description:"게임의 규칙과 이야기를 만들고 프로그램으로 게임을 제작합니다.", mission:"내가 만들고 싶은 게임의 제목과 주인공을 정해 보세요." },
  { name:"웹툰 작가", icon:"🖊️", description:"그림과 이야기를 활용해 사람들에게 재미와 감동을 전달합니다.", mission:"나를 주인공으로 한 웹툰의 한 장면을 그려 보세요." },
  { name:"사진작가", icon:"📷", description:"사진을 통해 사람, 장소, 순간의 이야기를 기록하고 표현합니다.", mission:"나를 가장 잘 보여 주는 사진 한 장면을 상상해 보세요." },
  { name:"패션 디자이너", icon:"👗", description:"옷과 액세서리의 모양과 색을 계획하고 새로운 스타일을 만듭니다.", mission:"미래에 내가 입고 싶은 옷을 디자인해 보세요." },
  { name:"화가", icon:"🎨", description:"색, 선, 형태와 다양한 재료를 사용해 자신의 생각과 감정을 표현합니다.", mission:"오늘의 기분을 색과 모양만으로 표현해 보세요." },
  { name:"과학자", icon:"🔬", description:"궁금한 현상을 관찰하고 실험하며 새로운 지식을 발견합니다.", mission:"내가 연구하고 싶은 신기한 현상을 하나 정해 보세요." },
  { name:"우주비행사", icon:"🚀", description:"우주선에 탑승해 우주를 탐사하고 다양한 연구 활동을 합니다.", mission:"내가 발견하고 싶은 새로운 행성을 디자인해 보세요." },
  { name:"환경 연구원", icon:"🌱", description:"자연과 환경의 변화를 연구하고 지구를 보호할 방법을 찾습니다.", mission:"지구를 지키는 나만의 발명품을 그려 보세요." },
  { name:"의사", icon:"🩺", description:"환자를 진료하고 질병을 예방하거나 치료하는 일을 합니다.", mission:"건강을 상징하는 나만의 마크를 만들어 보세요." },
  { name:"간호사", icon:"💙", description:"환자의 건강을 돌보고 치료와 회복을 돕습니다.", mission:"사람을 편안하게 해 주는 공간을 디자인해 보세요." },
  { name:"선생님", icon:"📚", description:"학생들이 새로운 것을 배우고 성장할 수 있도록 가르치고 돕습니다.", mission:"내가 선생님이라면 어떤 재미있는 수업을 만들지 생각해 보세요." },
  { name:"동물 조련사", icon:"🐕", description:"동물의 행동을 이해하고 훈련하며 동물과 사람이 안전하게 지낼 수 있도록 돕습니다.", mission:"내가 함께 일하고 싶은 동물을 캐릭터로 만들어 보세요." },
  { name:"조경가", icon:"🌳", description:"공원과 정원 등 사람들이 이용하는 아름답고 편안한 공간을 설계합니다.", mission:"내가 만들고 싶은 최고의 놀이터를 그려 보세요." },
  { name:"로봇 공학자", icon:"🤖", description:"사람에게 도움을 주는 로봇을 연구하고 설계합니다.", mission:"학교에서 일할 로봇을 하나 디자인해 보세요." },
  { name:"앱 개발자", icon:"📱", description:"스마트폰과 태블릿에서 사용할 수 있는 새로운 앱을 만듭니다.", mission:"학생들에게 도움이 되는 앱을 하나 기획해 보세요." },
  { name:"유튜버", icon:"🎥", description:"영상 콘텐츠를 기획하고 촬영·편집하여 사람들과 공유합니다.", mission:"내가 만든다면 어떤 영상 채널을 운영할지 정해 보세요." },
  { name:"작가", icon:"📖", description:"글을 통해 이야기와 생각, 상상 속 세계를 만들어 사람들에게 전달합니다.", mission:"내가 쓸 책의 제목과 표지를 디자인해 보세요." },
  { name:"음악가", icon:"🎵", description:"노래나 악기, 작곡 등을 통해 음악을 만들고 사람들에게 들려줍니다.", mission:"나를 표현하는 노래의 제목과 앨범 표지를 만들어 보세요." },
  { name:"연극 배우", icon:"🎭", description:"무대에서 인물의 감정과 이야기를 연기로 표현합니다.", mission:"내가 맡고 싶은 캐릭터의 표정과 의상을 디자인해 보세요." },
  { name:"기자", icon:"📰", description:"사람들에게 필요한 사건과 정보를 취재하고 기사로 전달합니다.", mission:"우리 학교의 재미있는 소식을 기사 제목으로 만들어 보세요." },
  { name:"통역사", icon:"🌎", description:"서로 다른 언어를 사용하는 사람들이 원활하게 소통하도록 돕습니다.", mission:"세계 여러 나라 친구들이 함께하는 학교 포스터를 디자인해 보세요." },
  { name:"파일럿", icon:"✈️", description:"비행기를 안전하게 운항하여 승객과 화물을 목적지까지 이동시킵니다.", mission:"내가 만들고 싶은 미래의 비행기를 디자인해 보세요." },
  { name:"경찰관", icon:"👮", description:"사람들의 안전을 지키고 범죄를 예방하며 질서를 유지합니다.", mission:"안전한 우리 동네를 상징하는 로고를 만들어 보세요." },
  { name:"법률가", icon:"⚖️", description:"법과 관련된 문제를 살펴보고 사람들이 권리를 지킬 수 있도록 돕습니다.", mission:"공정함을 상징하는 나만의 상징물을 만들어 보세요." },
  { name:"디자이너", icon:"✨", description:"사람들이 사용하고 보는 다양한 물건과 공간, 이미지를 새롭게 디자인합니다.", mission:"세상에 하나뿐인 학교 로고를 디자인해 보세요." },
  { name:"발명가", icon:"💡", description:"새로운 아이디어를 생각하고 사람들이 편리하게 사용할 수 있는 물건을 만듭니다.", mission:"학교생활을 편리하게 만들어 줄 발명품을 그려 보세요." }
];

const iconEl = document.getElementById("icon");
const nameEl = document.getElementById("jobName");
const descEl = document.getElementById("description");
const missionEl = document.getElementById("mission");
const missionTextEl = document.getElementById("missionText");
const button = document.getElementById("drawButton");
const card = document.getElementById("card");

let lastIndex = -1;

function showJob(job) {
  iconEl.textContent = job.icon;
  nameEl.textContent = job.name;
  descEl.textContent = job.description;
  missionTextEl.textContent = job.mission;
  missionEl.style.display = "block";
}

function drawJob() {
  button.disabled = true;
  card.classList.add("rolling");

  let count = 0;
  const rolling = setInterval(() => {
    let index;
    do {
      index = Math.floor(Math.random() * jobs.length);
    } while (jobs.length > 1 && index === lastIndex);

    showJob(jobs[index]);
    count++;

    if (count >= 12) {
      clearInterval(rolling);
      let finalIndex;
      do {
        finalIndex = Math.floor(Math.random() * jobs.length);
      } while (jobs.length > 1 && finalIndex === lastIndex);

      lastIndex = finalIndex;
      showJob(jobs[finalIndex]);
      card.classList.remove("rolling");
      button.disabled = false;
    }
  }, 90);
}

button.addEventListener("click", drawJob);
</script>
</body>
</html>
